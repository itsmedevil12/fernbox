[package]
name = "fernbox-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fernbox-core = { path = "../core" }
fernbox-proto = { path = "../proto" }
clap = { version = "4", features = ["derive"] }
home = "0.5"
serde = "1"
serde_json = "1"
getrandom = "0.2"
# The gate forwards raw HTTP as base64 over the string-only worker boundary, the
# same encoding the worker's fetch bodies use.
base64 = "0.22"
# The only crate that links a runtime: the daemon owns the listening socket, so
# it is the only one with I/O to overlap. Every other crate stays blocking,
# including the worker and the client, which must not carry a runtime they do
# not need.
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
] }
